<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Processing : ARIN</title>
        <link rel="stylesheet" href="./style.css">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        >
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <style>
            
        </style>
    </head>
    <body>
        <div class="container-fluid processing-page py-5 px-sm-2  min-vh-100 d-flex flex-column justify-content-center text-sm-center ">
          
            <div class="row justify-content-center text-center m-lg-5 p-lg-3"> 
                <div class="col-lg-6 pt-lg-5 mt-lg-5">
                    <h1 class="text-light analyze fs-1">
                        Analyzing Your Product...
                    </h1>
                    <p class="page-subtitle">
                        Our AI is working its magic ✨
                    </p>
                </div>
                <div class="col-lg-4 d-flex justify-content-center ps-lg-5 mb-4">
                    <div class="progress-wrapper position-relative">
                        <div class="progress-ring"></div>
                      
                        <div class="progress-inner d-flex flex-column justify-content-center align-items-center">
                            <h1 class="fw-bold text-white m-0" id="percentage">0%</h1>
                            <small class="text-secondary">Analyzing</small>
                        </div>
                    </div>
                </div>
            </div>
           <div class="row">
             <div class="status-card col-lg-10">
                <!-- Step 1 (Starts in progress) -->
                <div class="d-flex justify-content-between align-items-center pb-3 border-bottom border-secondary-subtle  gap-lg-5 gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <i id="icon1" class="bi bi-circle-fill processing-dot fs-5"></i>
                        <span id="text1" class="text-white fw-medium">Reading Label</span>
                    </div>
                    <div id="status1">
                        <small class="processing-text fw-bold">In Progress</small>
                    </div>
                </div>
                <!-- Step 2 -->
                <div class="d-flex justify-content-between align-items-center py-3 border-bottom border-secondary-subtle  gap-lg-5 gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <i id="icon2" class="bi bi-circle text-secondary fs-5"></i>
                        <span id="text2" class="text-secondary fw-medium">Extracting Ingredients</span>
                    </div>
                    <div id="status2">
                        <small class="text-secondary">Waiting</small>
                    </div>
                </div>
                <!-- Step 3 -->
                <div class="d-flex justify-content-between align-items-center py-3 border-bottom border-secondary-subtle gap-lg-5 gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <i id="icon3" class="bi bi-circle text-secondary fs-5"></i>
                        <span id="text3" class="text-secondary fw-medium">Analysing Nutrition</span>
                    </div>
                    <div id="status3">
                        <small class="text-secondary">Waiting</small>
                    </div>
                </div>
                <!-- Step 4 -->
                <div class="d-flex justify-content-between align-items-center pt-3 gap-lg-5 gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <i id="icon4" class="bi bi-circle text-secondary fs-5"></i>
                        <span id="text4" class="text-secondary fw-medium">Generating AI Report</span>
                    </div>
                    <div id="status4">
                        <small class="text-secondary">Waiting</small>
                    </div>
                </div>
            </div>
           </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="./script/process.js">
  
</script>
</body>
</html>
